name: DevOps CI/CD & Monitoring Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest

    - name: Build Docker Image
      run: |
        docker build -t devops-cicd-app:latest .

    - name: Run Application Health Check
      run: |
        docker run -d -p 5000:5000 --name test-app devops-cicd-app:latest
        sleep 3
        curl http://localhost:5000/health
